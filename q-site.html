VwhnfkaFsg5zFEV4uOAOSEDhiB", ROUNDS = 600000;
const NAME_KEY = "ardee-share-name";
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nm = document.getElementById("nm"), pc = document.getElementById("pc"), go = document.getElementById("go"), err = document.getElementById("err");
try { nm.value = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
const ready = () => { go.disabled = !(nm.value.trim() && pc.value.trim()); };
nm.addEventListener("input", ready); pc.addEventListener("input", ready); ready();
(nm.value ? pc : nm).focus();
function show(html) { document.open(); document.write(html); document.close(); }
async function openWith(pass) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ROUNDS, hash: "SHA-256" }, m,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, k, u8(DATA)));
  try { sessionStorage.setItem("ardee-share-pass", pass); } catch (e) {}
  show(html);
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = nm.value.trim(), typed = pc.value;
  if (!name || !typed.trim()) return;
  try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  go.disabled = true; go.textContent = "Opening…"; err.hidden = true;
  const fail = m => { err.textContent = m; err.hidden = false; go.textContent = "Open"; ready(); };
  if (!(window.crypto && crypto.subtle)) return fail("This browser can't open the page from here. Open the https link you were sent, in Chrome, Edge, Safari or Firefox.");
  // forgiving of a stray space or a capital typed by a phone keyboard: try as typed, then trimmed, then in small letters
  const tries = [...new Set([typed, typed.trim(), typed.trim().toLowerCase()])].filter(Boolean);
  for (const t of tries) { try { await openWith(t); return; } catch (e) {} }
  fail("That password didn't open the page. Check it and try again.");
});
(async () => {
  let saved = null; try { saved = sessionStorage.getItem("ardee-share-pass"); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) { try { await openWith(saved); } catch (e) { try { sessionStorage.removeItem("ardee-share-pass"); } catch (x) {} } }
