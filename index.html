<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ardee Shared Pages</title>
<style>
:root { --bg: #f4f6f8; --paper: #ffffff; --ink: #18212b; --muted: #5a6877; --rule: #d5dce3; --accent: #1d5c96; --bad: #9b3b33; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f151b; --paper: #151d25; --ink: #e2e8ee; --muted: #98a6b4; --rule: #2a3642; --accent: #7fb2e5; --bad: #ec8b82; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px 16px; }
form { background: var(--paper); border: 1px solid var(--rule); padding: 24px; width: min(100%, 380px); display: grid; gap: 12px; }
h1 { font: 700 1.5rem "Arial Narrow", "Segoe UI", sans-serif; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 0.92rem; }
input { font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); color: var(--ink); }
button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
button:disabled { opacity: 0.6; }
#err { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="f">
  <h1>Ardee Shared Pages</h1>
  <p>Ardee Engineering. Enter the passcode you were given to open this page.</p>
  <label for="pc">Passcode</label>
  <input id="pc" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Open</button>
  <p id="err" role="alert" hidden>That passcode didn't open the page. Check it and try again.</p>
</form>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openWith(pass) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ROUNDS, hash: "SHA-256" }, m,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, k, u8(DATA)));
  try { sessionStorage.setItem("ardee-share-pass", pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Opening\u2026"; err.hidden = true;
  if (!(window.crypto && crypto.subtle)) { err.textContent = "This browser can't open the page from here. Open the https link you were sent, in Chrome, Edge, Safari or Firefox."; err.hidden = false; go.disabled = false; go.textContent = "Open"; return; }
  try { await openWith(document.getElementById("pc").value); }
  catch (e) { err.textContent = "That passcode didn't open the page. Check it and try again."; err.hidden = false; go.disabled = false; go.textContent = "Open"; }
});
(async () => {
  let saved = null; try { saved = sessionStorage.getItem("ardee-share-pass"); } catch (e) {}
