<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ardee questions</title>
<style>
:root { --bg: #f4f6f8; --paper: #ffffff; --ink: #18212b; --muted: #5a6877; --rule: #c9d2db; --accent: #1d5c96; --off: #a9b4bf; --bad: #9b3b33; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f151b; --paper: #151d25; --ink: #e2e8ee; --muted: #98a6b4; --rule: #33414e; --accent: #7fb2e5; --off: #3a4652; --bad: #ec8b82; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 400 16px/1.4 "Segoe UI", system-ui, sans-serif; padding: 24px 16px; }
form { width: min(100%, 640px); display: grid; gap: 10px; }
.brand { font-size: 0.85rem; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: end; }
.field { flex: 1 1 0; min-width: 0; display: grid; gap: 4px; }
label { font-size: 0.85rem; font-weight: 600; }
input { width: 100%; min-width: 0; font: inherit; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
button { flex: 0 0 auto; font: inherit; font-weight: 600; padding: 9px 18px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { background: var(--off); border-color: var(--off); color: #fff; cursor: default; }
#err { margin: 0; color: var(--bad); font-size: 0.9rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) { input { padding: 8px; } button { padding: 8px 12px; } }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <div class="brand">Ardee Engineering · Ardee questions</div>
  <div class="row">
    <div class="field"><label for="nm">Name</label><input id="nm" type="text" autocomplete="name" maxlength="60"></div>
    <div class="field"><label for="pc">Password</label><input id="pc" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <button id="go" type="submit" disabled>Open</button>
  </div>
  <p id="err" role="alert" hidden></p>
</form>
<script>
// Everything inside one function, so nothing here clashes with the names the opened page uses (its DATA, PAGE …).
(() => {
const SALT = "akB8EbRmyKkMuVmu1jrybg==", IV = "5VArUcXTN5EQI5p8", DATA = "b0OFVXU/Z+DdnFe46wNnyEkPQm4zGx03yNQBFSkvDQo1I3nUowCZFqOfzCL+T/fqYTOS2q2E6zLsrEjjzyuXy+wJVxwCJhuIanVTFQd631Lk3SgNvusOKae7leVEv5bO9YYyey1WSIu55emA47jTJ8ItgiLUBQhkDQq1LHLqQ2liDECmOPkYjo0Ru1AZ3r8Vtt/SEftfq823CAWZooaoporA456U1UxCRYMOIcacsJW8Tx3aMEgty/9xSvkYEYMjp51sDWzqykbWuU0rzAHWKoxEwd9ufJ6fmJ76z4wditzxhA2SAB1nodKl3LMzUXZn2srBy/p0LubX9sytw6m/+X7IVpBkMP/L0umOMquIAvDi/54f/2tqrjXl7vDOcJrrN9kWwdlYr5dBApuKqRLhPuEnEV8t4nVb3oUFbe+Yrv69b6GnRrKluA/mWzNwcxl75kV+egzYNAly/BvPRpuZfAMUlC+v42dLbYjFeLJ2BTMZrm2Ro0E7VUL/GbBCJKjZmLY7IrmNUEEBeS1oj41yuBax+ScmCUBlxWzlWzfZG5G6SSNxU4lM96t/gMYFuBl2X1EUDsXDCueDC2YYgBbhsA3AcnLYznmuiJiI6JuTNFVByzsZpZuCoSz8OJVSTwxOX2Av6kgEWnBNx30ZcsYt3JPyl8vqg+T2xMhGkX04O9GPy5GN2pDFQiOdNQU9WxuKhHBr4VjYr7zyNjKcrZx1dNFyodHJ/nEaBaVZFurqxFdJXMEUDEo+eGTa7RVsmvPtmS/6a/roMvSm2J0sUZ/MROgYOwdCWl+gYDCUkfUmIIIjhm4SegY6IC8RXJciSr/98d3PO9RJFgR/rCZzMyZynUWnZk7Do3puXR72RbcoVjrlbywQ/3Cv9V3h8lIYOP1QxOcIRRMQe1OLH6P12BrAqUGlWd+3KwcG+KyLjLetLNA2snTL38wee/4kd4ChmBBn8EeStbBgo8WzSTQQt45lVy/XruM2vL4i3E8WRWb8K9MDYkGATTOHrA03E5C5qKBUuRhRlenuwokfUkFhmZmypHIuYDAoAcw0We+SRiBXTcSs5VTSyf9AqSat7/ruDANX7g1peamUYB9SmpENmw39hsaEAAHgWfK5rs39N8JSWB7qTI3Of54M9YOz49sN5NCe96jN7sHCKW1w3KQr0lTiQd3MOg7wtbp9gHt8WTjLMCllJ0IrnoO4uuvnXRwKfSu1qVI/6Uic8p4IMVSYBG70feBMYa1tQTRUuZ3Oyafa9ePo4L/z/wpA6+CKmcivl0UqXp2q5jn9rXGTGJcFa3hX0Lm1bI/62JDAmmp9QWbDlRj4duSuK/82sKD/52Qn0XPg7D0jUJdW8YKlJSth+/pwDxuT8BhUdN/8rWps27OVxZID85GxckAH9gUX0xYQRLst0dsIcrHtjQykGp8c2QomGfDYg4vndTiAG1YIINgArr4CL+k9xN/zh1Htbaso6TPYz/sa80Dwq8LwTo7Kw5w6THszEAFQJFxnK0Jb/o3ZUjxA8tA/+iIoeFHi0jo8QNru/vjF3BCKwNAp6f3Tkq/hPWLbU4D5jBbfhmcVX/N+LfEeGlU/jszJTAM838usorqL5pH4hP+/yxL9nzeKirx8cba1Tpij2SXOCiSJC9U8iMuFL+lSTIitrOxdmTjqEpF8JuQpAHbaipysZQP8uxCubowRItPn+DksDIEnw2XeBYOhxQ5nz0e2nLUtZXPfmwKxaIeN88U/e9qneVEwHqjd4oJX/jnHCd0FpRgVEpGB6JRfkNZJ5sRw0xBquA0yH4YXD3GR1z8fxWnksNJMoE/1xV27aeUpXwdSnXb1ppLOwAPeB9nIXCEFTHIgqc2ACJDWe4OD2J3D6FuKsjbVEemxzlJkaS9D2aVUxTkKC+718K7pQCyChF6JwTDmb4RNOjtoSan+Rr const NAME_KEY = "ardee-share-name";
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const nm = document.getElementById("nm"), pc = document.getElementById("pc"), go = document.getElementById("go"), err = document.getElementById("err");
try { nm.value = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
const ready = () => { go.disabled = !(nm.value.trim() && pc.value.trim()); };
nm.addEventListener("input", ready); pc.addEventListener("input", ready); ready();
(nm.value ? pc : nm).focus();
function show(html) { document.open(); document.write(html); document.close(); }
async function openWith(pass) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ROUNDS, hash: "SHA-256" }, m,
    { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(IV) }, k, u8(DATA)));
  try { sessionStorage.setItem("ardee-share-pass", pass); } catch (e) {}
  show(html);
}
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = nm.value.trim(), typed = pc.value;
  if (!name || !typed.trim()) return;
  try { localStorage.setItem(NAME_KEY, name); } catch (e) {}
  go.disabled = true; go.textContent = "Opening…"; err.hidden = true;
  const fail = m => { err.textContent = m; err.hidden = false; go.textContent = "Open"; ready(); };
  if (!(window.crypto && crypto.subtle)) return fail("This browser can't open the page from here. Open the https link you were sent, in Chrome, Edge, Safari or Firefox.");
  // forgiving of a stray space or a capital typed by a phone keyboard: try as typed, then trimmed, then in small letters
  const tries = [...new Set([typed, typed.trim(), typed.trim().toLowerCase()])].filter(Boolean);
  for (const t of tries) { try { await openWith(t); return; } catch (e) {} }
  fail("That password didn't open the page. Check it and try again.");
});
(async () => {
  let saved = null; try { saved = sessionStorage.getItem("ardee-share-pass"); } catch (e) {}
  if (saved && window.crypto && crypto.subtle) { try { await openWith(saved); } catch (e) { try { sessionStorage.removeItem("ardee-share-pass"); } catch (x) {} } }
})();
})();
</script>
</body>
</html>
