<style>
:root { --bg: #f4f6f8; --paper: #ffffff; --ink: #18212b; --muted: #5a6877; --rule: #d5dce3; --accent: #1d5c96; --bad: #9b3b33; color-scheme: light; }

p { margin: 0; color: var(--muted); font-size: 0.92rem; }

button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
button:disabled { opacity: 0.6; }
#err { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ROUNDS, hash: "SHA-256" }, m,

  if (!(window.crypto && crypto.subtle)) { err.textContent = "This browser can't open the page from here. Open the https link you were sent, in Chrome, Edge, Safari or Firefox."; err.hidden = false; go.disabled = false; go.textContent = "Open"; return; }

});
