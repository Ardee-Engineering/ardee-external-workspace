<style>

button { font: inherit; font-weight: 600; padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
button:disabled { opacity: 0.6; }
#err { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

async function openWith(pass) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(SALT), iterations: ROUNDS, hash: "SHA-256" }, m,

}
