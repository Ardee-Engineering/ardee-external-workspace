input { width: 100%; min-width: 0; font: inherit; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
button { flex: 0 0 auto; font: inherit; font-weight: 600; padding: 9px 18px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { background: var(--off); border-color: var(--off); color: #fff; cursor: default; }
#err { margin: 0; color: var(--bad); font-size: 0.9rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) { input { padding: 8px; } button { padding: 8px 12px; } }

function show(html) { document.open(); document.write(html); document.close(); }
async function openWith(pass) {
  const m = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
